services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mekascope
      POSTGRES_PASSWORD: mekascope
      POSTGRES_DB: mekascope
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mekascope -d mekascope"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
